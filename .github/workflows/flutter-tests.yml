name: Flutter

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: "stable"
      - name: Flutter get version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
      ##
      - name: Change working directory to chat module
        run: cd ./chat

      - name: Run webcrypto setup
        run: flutter pub run webcrypto:setup
        working-directory: ./chat

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./chat
      - name: Run Chat Module Tests
        run: flutter test
        working-directory: ./chat
