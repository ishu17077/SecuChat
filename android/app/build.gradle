plugins{
    id 'com.google.gms.google-services' version '4.4.3'
    id 'kotlin-android'
    id 'com.android.application'
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('./local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}



def keystoreProperties = new Properties()
def keystorePropertiesFile = project.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.developerik.secuchat'
    compileSdk flutter.compileSdkVersion
    ndkVersion "29.0.13846066"
    
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") { 
            variant.outputs.all { output ->
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                def apkName = "SecuChat-${variant.versionName}-${variant.versionCode}-${abiName}-release.apk"
                outputFileName = apkName
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.developerik.secuchat"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        multiDexEnabled true
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
       release {
        if (keystorePropertiesFile.exists()) {
            if (keystoreProperties['storeFile'] == null) {
                throw new GradleException("storeFile is not defined in key.properties")
            }
            if (keystoreProperties['storePassword'] == null) {
                throw new GradleException("storePassword is not defined in key.properties")
            }
            if (keystoreProperties['keyAlias'] == null) {
                throw new GradleException("keyAlias is not defined in key.properties")
            }
            if (keystoreProperties['keyPassword'] == null) {
                throw new GradleException("keyPassword is not defined in key.properties")
            }

            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            
        } else {
            throw new GradleException("key.properties file not found in ${keystorePropertiesFile.absolutePath}")
        }
    }
   }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // minifyEnabled true
            // useProguard true
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' 
            signingConfig signingConfigs.release
        }
    }
}




dependencies {
    implementation(platform("com.google.firebase:firebase-bom:34.3.0"))
    implementation('androidx.window:window:1.4.0')
    implementation('androidx.window:window-java:1.4.0')
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
